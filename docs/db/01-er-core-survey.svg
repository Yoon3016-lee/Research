</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  
  <text x="56" y="48" class="title">데이터베이스 구조 — 설문 코어</text>
  <text x="56" y="74" class="subtitle">surveys · questions · options · responses · CATI samples  ·  Supabase Postgres</text>

  
